{% if results %}
<ul class="divide-y divide-gray-200 dark:divide-gray-700">
    {% for t in results %}
    <li>
        <form method="post"
              action="/dashboard/{{ slug }}/rozliczenia/{{ settlement_id }}/tickets/link"
              class="block">
            <input type="hidden" name="ticket_id" value="{{ t.id }}">
            <button type="submit"
                    class="w-full text-left px-3 py-2 hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                <div class="flex items-baseline gap-2 min-w-0">
                    <span class="font-mono text-indigo-600 dark:text-indigo-400 text-xs flex-shrink-0">
                        {{ t.project.code }}-{{ t.number }}
                    </span>
                    <span class="text-sm text-gray-800 dark:text-gray-100 truncate">
                        {{ t.title | e }}
                    </span>
                </div>
            </button>
        </form>
    </li>
    {% endfor %}
</ul>
{% elif query %}
<p class="px-3 py-2 text-xs text-gray-500">Brak wyników dla "{{ query | e }}".</p>
{% else %}
<p class="px-3 py-2 text-xs text-gray-500">Zacznij wpisywać numer lub tytuł ticketu.</p>
{% endif %}
