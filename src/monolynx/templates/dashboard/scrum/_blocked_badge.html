{# Badge "zablokowany" -- wymaga zmiennej `ticket` w kontekscie (z eager-loaded `blocked_by`). #}
{% set active_blockers = ticket.blocked_by | rejectattr("status", "equalto", "done") | list %}
{% if active_blockers %}
<span data-testid="blocked-badge"
      class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 dark:bg-amber-900 text-amber-800 dark:text-amber-300 flex-shrink-0"
      title="Zablokowany przez: {{ active_blockers | map(attribute='title') | join(', ') }}">
    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
    </svg>
    zablokowany
</span>
{% endif %}
