stages:
  - build
  - lint
  - test
  - push
  - deploy
  - publish

.docker-dind:
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"

# --- Build ---

docker-build-test:
  stage: build
  extends: .docker-dind
  script:
    - docker build --target dev --tag "$CI_REGISTRY_IMAGE:dev" .
    - docker build --tag "$CI_REGISTRY_IMAGE:test" .
    - docker push "$CI_REGISTRY_IMAGE:dev"
    - docker push "$CI_REGISTRY_IMAGE:test"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    # Branche sprintu sa branchem docelowym MR-ow w trakcie sprintu; mr-queue
    # czeka na zielone CI brancha docelowego po merge, wiec musi tu byc pipeline.
    - if: $CI_COMMIT_BRANCH =~ /^sprint\//

# --- Lint ---

clean-code:
  stage: lint
  extends: .docker-dind
  # Jeden clean-code naraz na projekt: joby wspoldziela demona Dockera runnera,
  # a rownolegly job z tymi samymi nazwami kontenerow zabijal cudze
  # `db`/`test-runner` swoim `docker rm -f` (SIGKILL = "exit status 137",
  # MON-175). Nazwy z $CI_JOB_ID to drugi bezpiecznik, gdyby resource_group
  # nie objal pipeline'ow z roznych refow.
  resource_group: clean-code
  variables:
    TEST_DB: "db-$CI_JOB_ID"
    TEST_RUNNER: "test-runner-$CI_JOB_ID"
    TEST_NET: "test-net-$CI_JOB_ID"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:dev"
    - docker run --rm "$CI_REGISTRY_IMAGE:dev" ruff check src/ tests/ sdk/
    - docker run --rm "$CI_REGISTRY_IMAGE:dev" ruff format --check src/ tests/ sdk/
    - docker run --rm "$CI_REGISTRY_IMAGE:dev" mypy src/
    - docker rm -f "$TEST_DB" "$TEST_RUNNER" 2>/dev/null || true
    - docker network rm "$TEST_NET" 2>/dev/null || true
    - docker network create "$TEST_NET"
    - docker run -d --name "$TEST_DB" --network "$TEST_NET" --network-alias db
        -e POSTGRES_USER=sentry
        -e POSTGRES_PASSWORD=sentry_ci
        pgvector/pgvector:pg16
    - sleep 5
    - TEST_EXIT=0
    # Obraz dev nie zawiera alembic/, a testy migracji laduja plik migracji po
    # sciezce. Montowanie tylko do odczytu: root w kontenerze nie zostawi
    # __pycache__ w build dirze, na ktorym padlby `git clean` runnera.
    - docker run --name "$TEST_RUNNER" --network "$TEST_NET"
        -v "$CI_PROJECT_DIR/alembic:/app/alembic:ro"
        -e DATABASE_URL="postgresql+asyncpg://sentry:sentry_ci@db:5432/open_sentry"
        "$CI_REGISTRY_IMAGE:dev"
        pytest tests/ --cov=src/monolynx --cov-report=term --cov-report=xml:coverage.xml
        || TEST_EXIT=$?
    - docker cp "$TEST_RUNNER:/app/coverage.xml" coverage.xml || true
    - docker rm -f "$TEST_DB" "$TEST_RUNNER" 2>/dev/null || true
    - docker network rm "$TEST_NET" 2>/dev/null || true
    - exit $TEST_EXIT
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^sprint\//

plugin-consistency:
  stage: lint
  image: python:3.12-slim
  script:
    - python3 scripts/validate_plugin_consistency.py
    - python3 scripts/sync_skills.py --check
    # Ten job chodzi po pelnym checkoucie, wiec widzi .claude/agents/ - obraz
    # :dev go nie kopiuje, wiec test integracyjny w clean-code sie pomija.
    - python3 scripts/sync_agents.py --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^sprint\//

# Runner jest shell executorem: `image:` jest ignorowane, a pip nie ma na hoscie,
# wiec kontener startujemy z hosta przez `docker run` (jak clean-code). Repo
# montowane read-only, a praca idzie na kopii w kontenerze: kontener dziala jako
# root i pliki zapisane w build dirze (cache ruffa) zablokowalyby runnerowi
# `git clean`. Kopiujemy tylko root pyproject.toml (config ruffa, cli/pyproject.toml
# nie ma [tool.ruff]) i cli/. Osobny job bez matrixa: lint nie zalezy od wersji
# Pythona. Wersja ruffa jak w requirements/dev.txt.
lint:cli:
  stage: lint
  needs: []
  script:
    - |
      docker run --rm -v "$CI_PROJECT_DIR":/src:ro python:3.12-slim sh -c "
        mkdir /w && cp /src/pyproject.toml /w/ && cp -r /src/cli /w/cli && cd /w &&
        pip install --no-cache-dir 'ruff>=0.8' &&
        ruff check cli/ &&
        ruff format --check cli/"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^sprint\//

trivy-scan:
  stage: test
  extends: .docker-dind
  variables:
    TRIVY_VERSION: "0.70.0"
  before_script:
#    - curl -sfL https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz | tar xzf - -C /usr/local/bin trivy
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - trivy fs --scanners vuln --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 requirements/base.txt
    - docker pull "$CI_REGISTRY_IMAGE:test"
    - trivy image --ignore-unfixed --exit-code 0 "$CI_REGISTRY_IMAGE:test"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# Runner jest shell executorem (`image:` jest ignorowane, na hoście nie ma apk),
# więc dockle startuje jako kontener z hosta i czyta obraz przez socket dockera.
# Dwa wyjątki, oba sprawdzone na obrazie runtime (dockle 0.4.14 i 0.4.15 dają
# ten sam wynik, więc wersji nie podbijamy):
# - `-af settings.py` (CIS-DI-0010): fałszywy alarm po nazwie pliku, w obrazie
#   to monolynx/dashboard/settings.py (router FastAPI) i mcp/server/auth/settings.py
#   (model pydantic biblioteki mcp), żaden nie zawiera sekretów. Dopasowanie jest
#   po nazwie bazowej, więc obejmuje każdy `settings.py`; nowy plik o tej nazwie
#   trzeba sprawdzić ręcznie. Sam check CIS-DI-0010 zostaje włączony.
# - `-i DKL-DI-0005`: zgłaszana jest warstwa obrazu bazowego python:3.12-slim
#   (`apt-get dist-clean`, którego dockle nie rozpoznaje), a własne `RUN` w
#   Dockerfile czyszczą `/var/lib/apt/lists`. Check jest wyłączony dla całego
#   obrazu; do zdjęcia, gdy dockle zacznie rozpoznawać `dist-clean`.
# `.gitlab-ci.yml` w `changes`, bo zmiana wyjątków ma uruchamiać skan, inaczej
# błąd w konfiguracji wychodzi dopiero przy następnej zmianie Dockerfile.
dockle-scan:
  stage: test
  extends: .docker-dind
  variables:
    DOCKLE_VERSION: "0.4.14"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker pull "$CI_REGISTRY_IMAGE:test"
    - docker run --rm -v /var/run/docker.sock:/var/run/docker.sock goodwithtech/dockle:v${DOCKLE_VERSION} --exit-code 1 -af settings.py -i DKL-DI-0005 "$CI_REGISTRY_IMAGE:test"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .gitlab-ci.yml

# CLI jest samodzielna paczka (requires-python >=3.10), wiec sprawdzamy ja na
# calym zakresie wersji, bez bazy. Runner jest shell executorem (`image:` jest
# ignorowane), wiec kontener startuje z hosta przez `docker run`. Kopia w
# kontenerze zamiast zapisu w build dirze: root zostawilby tam __pycache__,
# .coverage i egg-info, na ktorych padlby `git clean` runnera. `cd /cli` jest
# celowe: pytest i coverage wybieraja konfig po CWD, a w rootcie repo wzialyby
# pyproject.toml serwera (asyncio, source=src/monolynx). Editable install +
# --cov=monolynx_cli mierzy pakiet, nie sciezke plikow.
test:cli:
  stage: test
  needs: []
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.10", "3.11", "3.12", "3.13"]
  script:
    - |
      docker run --rm -v "$CI_PROJECT_DIR/cli":/src:ro python:${PYTHON_VERSION}-slim sh -c "
        cp -r /src /cli && cd /cli &&
        pip install --no-cache-dir -e '.[test]' &&
        pytest tests/ -m 'not e2e' --cov=monolynx_cli --cov-report=term --cov-fail-under=80"
  coverage: '/(?i)total.*? (100(?:\.0+)?\%|[1-9]?\d(?:\.\d+)?\%)$/'
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH =~ /^sprint\//

# --- Push ---

docker-push-develop:
  stage: push
  extends: .docker-dind
  script:
    - IMAGE_TAG="$(date +%Y%m%d)"
    - docker pull "$CI_REGISTRY_IMAGE:test"
    - docker tag "$CI_REGISTRY_IMAGE:test" "$CI_REGISTRY_IMAGE:develop"
    - docker tag "$CI_REGISTRY_IMAGE:test" "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
    - docker push "$CI_REGISTRY_IMAGE:develop"
    - docker push "$CI_REGISTRY_IMAGE:$IMAGE_TAG"
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"

docker-push-prod:
  stage: push
  extends: .docker-dind
  script:
    - docker pull "$CI_REGISTRY_IMAGE:test"
    - docker tag "$CI_REGISTRY_IMAGE:test" "$CI_REGISTRY_IMAGE:latest"
    - docker tag "$CI_REGISTRY_IMAGE:test" "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# --- Deploy ---

deploy-staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "TODO -- deploy to staging"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual

# graphify musi byc zainstalowane na runnerze (jednorazowy setup) - step go
# tylko uzywa; brak = non-blocking skip, build przechodzi (MON-118)
# Zmienne MONOLYNX_URL / MONOLYNX_GRAPH_TOKEN / MONOLYNX_PROJECT_SLUG pochodza
# z CI/CD Settings -> Variables (sa dostepne w srodowisku automatycznie -
# NIE deklarowac ich w bloku variables: self-referencja daje literal "${...}")
sync-graph:
  stage: deploy
  allow_failure: true
  script:
    - command -v graphify || { echo "graphify nie zainstalowane na runnerze - setup https://github.com/Graphify-Labs/graphify"; exit 0; }
    - graphify update .
    - python cicd/sync_graph.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

wiki-post-merge:
  stage: deploy
  image: python:3.12-slim
  script:
    - python cicd/wiki_post_merge.py
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success

# --- Publish (monolynx-cli na PyPI) ---

# Autoryzacja przez PyPI Trusted Publishing (OIDC) - zaden dlugozyjacy token
# w zmiennych CI/CD. Twine (przez pakiet `id`) sam wymienia token OIDC na
# krotkozyjacy token uploadu, wiec nic nie trafia do logu joba. Nazwa
# zmiennej w `id_tokens` MUSI odpowiadac audience: `id` szuka `<AUD>_ID_TOKEN`
# (uppercase), stad PYPI_ID_TOKEN dla aud=pypi i TESTPYPI_ID_TOKEN dla
# aud=testpypi - to nie jest jedna stala nazwa dla obu jobow. Bramka wersji
# stoi przed uploadem, bo ten jest nieodwracalny.
#
# Runner jest shell executorem: `image:` jest ignorowane (stad jego brak), a pip
# nie ma na hoscie, wiec build, bramka i upload ida w jednym `docker run` (jak
# lint:cli i test:cli). Repo montowane read-only, praca na kopii w kontenerze:
# kontener dziala jako root i dist/ oraz egg-info w build dirze zablokowalyby
# runnerowi `git clean`. Tokeny OIDC przechodza do kontenera przez `-e NAZWA` bez
# wartosci (wartosc nie trafia do logu ani do `ps`); `GITLAB_CI` jest potrzebne,
# bo pakiet `id` uzywany przez twine wykrywa srodowisko GitLaba po tej zmiennej.
# Skrypt w kontenerze idzie przez zmienna, zeby `$` rozwijalo sie dopiero tam.
.publish-cli:
  stage: publish
  script:
    - |
      IFS= read -r -d '' PUBLISH_SCRIPT <<'PUBLISH' || true
      set -e
      cp -r /src /w
      cd /w
      pip install --no-cache-dir build==1.6.1 twine==7.0.0
      python -m build
      twine check --strict dist/*
      # Bramka wersji PRZED uploadem: numer paczki (jedyne zrodlo -
      # src/monolynx_cli/version.py) musi byc identyczny z tagiem bez prefiksu
      # cli-v, inaczej job konczy sie bledem i nic nie jest wysylane.
      PKG_VERSION="$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/monolynx_cli/version.py)"
      TAG_VERSION="${CI_COMMIT_TAG#cli-v}"
      if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
        echo "Wersja paczki ($PKG_VERSION) nie zgadza sie z tagiem $CI_COMMIT_TAG" >&2
        exit 1
      fi
      twine upload --repository "$TWINE_REPOSITORY" dist/*
      PUBLISH
      docker run --rm \
        -v "$CI_PROJECT_DIR/cli":/src:ro \
        -e PYPI_ID_TOKEN -e TESTPYPI_ID_TOKEN -e GITLAB_CI -e TWINE_REPOSITORY -e CI_COMMIT_TAG \
        python:3.12-slim bash -c "$PUBLISH_SCRIPT"

publish-pypi:
  extends: .publish-cli
  variables:
    TWINE_REPOSITORY: pypi
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  environment: pypi
  rules:
    - if: $CI_COMMIT_TAG =~ /^cli-v\d+\.\d+\.\d+$/

publish-testpypi:
  extends: .publish-cli
  variables:
    TWINE_REPOSITORY: testpypi
  id_tokens:
    TESTPYPI_ID_TOKEN:
      aud: testpypi
  environment: testpypi
  rules:
    - if: $CI_COMMIT_TAG =~ /^cli-v\d+\.\d+\.\d+rc\d+$/

# --- Publish (Homebrew tap monolynx/tap, MON-138) ---

# Tag numerowany, nie ruchomy (latest/master), żeby job był powtarzalny w czasie.
# Runner jest shell executorem: `image:` jest ignorowane (stąd jego brak), więc kontener
# startuje z hosta przez `docker run`, jak w lint:cli i test:cli. Repo montowane read-only,
# praca na kopii w kontenerze. Zaktualizowana formuła wraca na hosta przez osobny,
# zapisywalny katalog /out (mktemp, chmod 777: działa też przy remapowaniu użytkowników
# Dockera), a na hoście kopiuje ją runner - plik w workspace ma wtedy właściciela runnera
# i nie blokuje `git clean`. Formuła trafia do /out zaraz po podbiciu url/sha256, jeszcze
# przed regeneracją bloków resource i pushem, żeby artefakt miał poprawny url/sha256
# także gdy któryś z dalszych kroków padnie. Token tapu idzie przez `-e HOMEBREW_TAP_TOKEN`
# bez wartości (nie trafia do logu ani do `ps`).
# Job nie używa Homebrew: bloki resource generuje cli/scripts/bump_formula.py z raportu pip,
# bo sandbox Homebrew w `update-python-resources` wymaga Landlock ABI 2, a kernel runnera
# ma ABI 1. Obraz python:3.13 jest pełny (nie -slim), bo potrzebne są git i curl.
bump-homebrew:
  stage: publish
  needs:
    - job: publish-pypi
  script:
    - |
      IFS= read -r -d '' BUMP_SCRIPT <<'BUMP' || true
      set -e
      WORK="$(mktemp -d)"
      cp /src/cli/scripts/bump_formula.py /src/cli/packaging/homebrew/monolynx.rb "$WORK/"
      # Retry wbudowany w skrypt: sdist bywa widoczny w PyPI JSON z opóźnieniem po publish-pypi.
      python3 "$WORK/bump_formula.py" --tag "$CI_COMMIT_TAG" --formula "$WORK/monolynx.rb"
      # Artefakt z poprawnym url/sha256 powstaje, nawet gdy regeneracja resource padnie.
      cp "$WORK/monolynx.rb" /out/monolynx.rb
      # Tuż po publish-pypi indeks PyPI może jeszcze nie widzieć wersji - ponawiamy.
      VERSION="${CI_COMMIT_TAG#cli-v}"
      PIP_OK=0
      for ATTEMPT in 1 2 3 4 5; do
        if pip install -q --disable-pip-version-check --dry-run --ignore-installed --report "$WORK/pip-report.json" "monolynx-cli==$VERSION"; then
          PIP_OK=1
          break
        fi
        echo "pip nie widzi monolynx-cli==$VERSION (próba $ATTEMPT/5)." >&2
        [ "$ATTEMPT" -lt 5 ] && sleep 15
      done
      if [ "$PIP_OK" -ne 1 ]; then
        echo "Nie udało się zbudować raportu pip dla monolynx-cli==$VERSION." >&2
        exit 1
      fi
      python3 "$WORK/bump_formula.py" --tag "$CI_COMMIT_TAG" --formula "$WORK/monolynx.rb" --pip-report "$WORK/pip-report.json"
      cp "$WORK/monolynx.rb" /out/monolynx.rb
      # Pierwszy release: Formula/monolynx.rb jeszcze nie istnieje w tapie (404) -> bez
      # pushu, formułę z artefaktu wypycha ręcznie właściciel. Kod inny niż 200/404
      # (błąd sieci itp.) -> wariant bezpieczny: też bez pushu.
      HTTP_CODE="$(curl -s -o /dev/null -w '%{http_code}' https://raw.githubusercontent.com/Monolynx/homebrew-tap/main/Formula/monolynx.rb)"
      case "$HTTP_CODE" in
        404)
          echo "Pierwsze wydanie - Formula/monolynx.rb jeszcze nie istnieje w tapie, bez pushu."
          ;;
        200)
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN nie ustawiony - nie mogę wypchnąć zaktualizowanej formuły." >&2
            exit 1
          fi
          # Token tylko przez credential.helper czytający zmienną środowiskową - nigdy
          # w URL-u (trafiłby do komunikatów błędów gita); bez set -x w tym jobie.
          git config --global user.email "ci@monolynx.com"
          git config --global user.name "Monolynx CI"
          git config --global credential.helper '!f() { echo "username=x-access-token"; echo "password=$HOMEBREW_TAP_TOKEN"; }; f'
          TAP_DIR="$(mktemp -d)"
          git clone --depth 1 https://github.com/Monolynx/homebrew-tap.git "$TAP_DIR"
          cp "$WORK/monolynx.rb" "$TAP_DIR/Formula/monolynx.rb"
          cd "$TAP_DIR"
          git add Formula/monolynx.rb
          # Ponowny przebieg na tym samym tagu po udanym pushu: formuła już jest w tapie.
          if git diff --cached --quiet; then
            echo "Tap ma już formułę dla ${CI_COMMIT_TAG#cli-v} - bez commita i pushu."
          else
            git commit -m "monolynx ${CI_COMMIT_TAG#cli-v}"
            git push origin main
          fi
          ;;
        *)
          echo "Nie można ustalić stanu tapu (HTTP $HTTP_CODE) - wariant bezpieczny: bez pushu." >&2
          ;;
      esac
      BUMP
      OUT="$(mktemp -d)"
      chmod 777 "$OUT"
      RC=0
      docker run --rm \
        -v "$CI_PROJECT_DIR":/src:ro \
        -v "$OUT":/out \
        -e CI_COMMIT_TAG -e HOMEBREW_TAP_TOKEN \
        python:3.13 bash -c "$BUMP_SCRIPT" || RC=$?
      if [ -f "$OUT/monolynx.rb" ]; then
        cp "$OUT/monolynx.rb" cli/packaging/homebrew/monolynx.rb
        rm "$OUT/monolynx.rb"
      fi
      rmdir "$OUT"
      exit "$RC"
  artifacts:
    when: always
    paths:
      - cli/packaging/homebrew/monolynx.rb
    expire_in: 30 days
  rules:
    - if: $CI_COMMIT_TAG =~ /^cli-v\d+\.\d+\.\d+$/
