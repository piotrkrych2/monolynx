[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "monolynx-cli"
dynamic = ["version"]
description = "Interfejs wiersza poleceń dla platformy Monolynx"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["monolynx", "cli", "scrum", "issue-tracking", "project-management"]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Intended Audience :: Developers",
]
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "pydantic>=2.0",
    "platformdirs>=4.0",
    "tomli>=2.0; python_version < \"3.11\"",
    "tomli-w>=1.0",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://gitlab.com/piotrkrych/monolynx"
Documentation = "https://gitlab.com/piotrkrych/monolynx/-/blob/main/cli/README.md"
Source = "https://gitlab.com/piotrkrych/monolynx"
Issues = "https://gitlab.com/piotrkrych/monolynx/-/issues"

[project.scripts]
monolynx = "monolynx_cli.main:app"
mnx = "monolynx_cli.main:app"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
]

[tool.hatch.version]
path = "src/monolynx_cli/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/monolynx_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: testy jednostkowe (bez sieci, bez zewnetrznych zasobow)",
    "e2e: testy end-to-end (wymagaja uruchomionego serwera Monolynx)",
]

[tool.coverage.run]
source = ["monolynx_cli"]
branch = true
